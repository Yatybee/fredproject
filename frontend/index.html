<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a4a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Referral Tracker</title>
    <script>
      // Apply a saved dark-mode choice before first paint, so there is no light flash on reload.
      try { if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220')
      } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
